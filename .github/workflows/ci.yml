name: CI

on:
  push:
  pull_request:

jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install shellcheck
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Run installer tests
        run: ./tests/test-install.sh
      - name: Test orchestrator mutation guard
        run: node --test tests/test-orchestrator-guard.js
      - name: Test cross-host prompt fast path
        run: node --test tests/test-prompt-router.js
      - name: Test OpenCode plugin adapter
        run: node tests/test-opencode-adapter.js
      - name: Test OpenCode environment doctor
        run: node tests/test-opencode-doctor.cjs
      - name: Test routing and skill parity
        run: node tests/test-routing-parity.js
      - name: Validate context docs sync script
        run: ./tests/test-sync-context-docs.sh
      - name: ShellCheck shell scripts
        run: find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck --severity=warning
      - name: Validate proof-runner skill
        run: ./tests/test-proof-runner.sh
      - name: Validate Herdr plugin MVP
        run: ./tests/test-herdr-plugin.sh
      - name: Build OpenAI/Codex plugin bundle
        run: ./tests/test-openai-plugin-build.sh

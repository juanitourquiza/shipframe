name: CI

on:
  push:
  pull_request:

jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install shellcheck
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Run installer tests
        run: ./tests/test-install.sh
      - name: Validate proof-runner skill
        run: ./tests/test-proof-runner.sh
      - name: Build OpenAI/Codex plugin bundle
        run: ./tests/test-openai-plugin-build.sh
